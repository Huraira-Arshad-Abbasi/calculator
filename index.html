<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="calculator">
            <div class="output__box">
                <input type="text"   />
                <h2>0</h2>
            </div>
            <div class="btn__box">
                <button>1/</button>
                <button>(</button>
                <button>)</button>
                <button>clear</button>
                <button>Clear All</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>
                <button>**2</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
                <button>3.14</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
                <button>**</button>
                <button>0</button>
                <button>.</button>
                <button>%</button>
                <button>/</button>
                <button>=</button>
            </div>
        </div>
        <div class="history">
            <h5>History</h5>
            <ul>
                There's is no history yet!
            </ul>
        </div>
    </div>
    <!-- javascript -->
     <script src="script.js"></script>
</body>

</html>
